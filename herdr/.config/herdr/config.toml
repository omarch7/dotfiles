onboarding = false
# herdr configuration
# Place this file at ~/.config/herdr/config.toml

[keys]
# Matches tmux prefix (set -g prefix C-s)
prefix = "ctrl+s"

# tmux: bind % split-window -h   (side-by-side)  -> herdr split_vertical = side-by-side
# tmux: bind '"' split-window -v (stacked)       -> herdr split_horizontal = stacked
split_vertical = "prefix+%"
split_horizontal = "prefix+\""

# tmux: bind-key h/j/k/l select-pane -L/-D/-U/-R
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

# tmux: bind -n M-1..9 select-window -t 1..9 (direct, no prefix)
switch_tab = "alt+1..9"

# tmux: bind -n M-Left/M-Right select-window -t -1/+1 (direct, no prefix)
previous_tab = "alt+left"
next_tab = "alt+right"

# tmux: bind , command-prompt -p "Rename window:" "rename-window '%%'"
rename_tab = "prefix+comma"

# Workspace navigation: layers shift on top of the alt+1..9 tab scheme, so the
# number row stays consistent (tabs = alt, workspaces = alt+shift).
switch_workspace = "alt+shift+1..9"
previous_workspace = "alt+shift+left"
next_workspace = "alt+shift+right"

# Agent navigation: same number row again, on ctrl+shift (distinct from the
# alt-based tab/workspace family and from the ctrl+hjkl pane nav below).
focus_agent = "ctrl+shift+1..9"
previous_agent = "ctrl+shift+left"
next_agent = "ctrl+shift+right"

# --- Seamless nvim <-> herdr pane navigation (smart-splits.nvim) ---
# Bare ctrl+h/j/k/l move; nav.sh forwards the chord into nvim when it is the
# focused pane's foreground process (nvim's smart-splits then moves splits and
# crosses back into herdr at the edge), else moves the herdr pane directly.
# prefix+h/j/k/l above remains the always-move-the-pane escape hatch.
[[keys.command]]
key = "ctrl+h"
type = "shell"
command = "~/.config/herdr/scripts/nav.sh focus left ctrl+h"

[[keys.command]]
key = "ctrl+j"
type = "shell"
command = "~/.config/herdr/scripts/nav.sh focus down ctrl+j"

[[keys.command]]
key = "ctrl+k"
type = "shell"
command = "~/.config/herdr/scripts/nav.sh focus up ctrl+k"

[[keys.command]]
key = "ctrl+l"
type = "shell"
command = "~/.config/herdr/scripts/nav.sh focus right ctrl+l"

# Resize: ctrl+alt+h/j/k/l (nav.sh uses a 0.05 herdr ratio, matching the nvim
# backend's HERDR_RESIZE_RATIO so cross-boundary and direct resize steps match).
[[keys.command]]
key = "ctrl+alt+h"
type = "shell"
command = "~/.config/herdr/scripts/nav.sh resize left ctrl+alt+h"

[[keys.command]]
key = "ctrl+alt+j"
type = "shell"
command = "~/.config/herdr/scripts/nav.sh resize down ctrl+alt+j"

[[keys.command]]
key = "ctrl+alt+k"
type = "shell"
command = "~/.config/herdr/scripts/nav.sh resize up ctrl+alt+k"

[[keys.command]]
key = "ctrl+alt+l"
type = "shell"
command = "~/.config/herdr/scripts/nav.sh resize right ctrl+alt+l"

[theme]
name = "catppuccin"
auto_switch = true
